<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 모산초등학교 학부모 공개수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 학교 안내문 그대로 — 보라 테두리 · 분홍 제목상자 · 남색 제목띠 / 화면 3개로 나눔: 처음(한눈에 보기) · 반별 수업 안내 · 관람 안내 */
:root{
  --frame:#dcebf7; --panel:#ffffff; --head:#ffbac8; --box:#ffe0e6; --border:#2e2e2e;
  --navy:#1b3a5c; --mint:#c9f3d3; --fg:#232323; --muted:#555;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
body{background:var(--frame);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.page{max-width:820px;margin:0 auto;padding-block:16px 32px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:6px solid var(--border);padding:18px 16px 24px;display:grid;gap:20px}
h1,h2,.pill,.cls{font-family:var(--display);font-weight:400}
.hero{background:var(--head);border:5px solid var(--border);padding:16px 14px;text-align:center}
.hero h1{margin:0;font-size:clamp(26px,7vw,44px);line-height:1.2;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--navy);font-family:var(--display);font-size:clamp(17px,4.4vw,24px)}
.hero .when{display:inline-block;margin-top:10px;background:var(--navy);color:var(--mint);border-radius:999px;padding:4px 16px;font-family:var(--display);font-size:20px}
.bar{background:var(--head);border:4px solid var(--border);padding:8px 12px;text-align:center;font-family:var(--display);font-size:20px}
.pill{display:block;width:fit-content;margin:0 auto 12px;background:var(--navy);color:var(--mint);border-radius:999px;padding:4px 28px;font-size:26px}
.box{background:var(--box);border:4px solid var(--border);padding:16px 14px}
.glancebox{background:#fff}

/* 버튼 */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:8px 12px;border:3px solid var(--border);border-radius:12px;background:var(--navy);color:#fff;font-family:var(--display);font-size:21px;text-decoration:none;text-align:center;cursor:pointer}
.btn.light{background:#fff;color:var(--fg)}
.btn:focus-visible{outline:3px solid var(--head);outline-offset:2px}
.btn.wide{grid-column:1/-1}

/* 한눈에 표 */
.glance{display:grid;gap:10px}
.period{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:stretch}
.pnum{background:var(--navy);color:#fff;border-radius:10px;display:grid;place-content:center;text-align:center;padding:6px}
.pnum b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.pnum small{color:var(--mint);font-variant-numeric:tabular-nums;font-size:12px}
.rows{display:grid;gap:6px;min-width:0}
.row{background:var(--tint,#fff);border:2px solid var(--border);border-radius:8px;padding:6px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;text-decoration:none;color:inherit}
.row:hover,.row:focus-visible{outline:none;box-shadow:0 0 0 3px var(--col)}
.row .c{font-family:var(--display);font-size:19px;white-space:nowrap;background:var(--col);color:var(--ink,#fff);border-radius:6px;padding:0 9px}
.row .s{font-weight:700;color:var(--navy);font-size:14px}
.row .go{font-family:var(--display);color:var(--navy);font-size:18px}
.row .t{grid-column:1/-1;font-size:15px}
.row .l{grid-column:1/-1;font-size:13px;color:var(--muted)}
.hint{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}

/* 반별 상세 */
.card{background:var(--tint,#fff);border:4px solid var(--border);overflow:hidden}
.card .cls{font-size:32px;margin:0;background:var(--col);color:var(--ink,#fff);padding:8px 16px;border-bottom:4px solid var(--border)}
.kv{margin:0;padding:14px 16px 18px;display:grid;gap:12px}
.kv div{display:grid;gap:2px}
.kv dt{font-weight:700;color:var(--navy);font-size:14px}
.kv dd{margin:0;font-size:18px;font-variant-numeric:tabular-nums}
.kv dd b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.3;display:block}
.others{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.others a{font-family:var(--display);font-size:17px;text-decoration:none;background:var(--col);color:var(--ink,#fff);border:2px solid var(--border);border-radius:999px;padding:2px 12px}
.others a[aria-current="true"]{outline:3px solid var(--border);outline-offset:2px}

/* 부탁 */
.asks{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.asks li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.asks svg{width:52px;height:52px}
.asks strong{font-family:var(--display);font-weight:400;font-size:22px;display:block;line-height:1.25}
.asks span{color:var(--muted);font-size:15px}
.sign{display:grid;gap:4px;text-align:center;font-family:var(--display);font-size:24px}
</style>
</head>
<body>

<div class="page"><div class="sheet" id="app"></div></div>

<template id="t-asks">
<section class="box" aria-labelledby="a">
  <h2 class="pill" id="a">부탁드립니다.</h2>
  <ul class="asks">
    <li><svg viewBox="0 0 52 52" aria-hidden="true"><rect x="15" y="4" width="22" height="44" rx="4" fill="#222"/><circle cx="26" cy="26" r="14" fill="none" stroke="#e0261c" stroke-width="4"/><path d="M16 16l20 20" stroke="#e0261c" stroke-width="4"/></svg>
      <div><strong>1. 핸드폰은 무음 모드로 해주세요.</strong></div></li>
    <li><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23" fill="none" stroke="#e0261c" stroke-width="4"/><rect x="11" y="18" width="30" height="20" rx="3" fill="#111"/><rect x="20" y="14" width="12" height="5" fill="#111"/><circle cx="26" cy="28" r="6" fill="#fff"/><circle cx="26" cy="28" r="3.5" fill="#111"/><path d="M10 10l32 32" stroke="#e0261c" stroke-width="4"/></svg>
      <div><strong>2. 사진, 동영상 촬영은 금지해주세요.</strong><span>마음에만, 눈에만 예쁘게 담아주시기를 부탁드립니다.</span></div></li>
    <li><svg viewBox="0 0 52 52" aria-hidden="true"><rect x="5" y="12" width="34" height="26" rx="3" fill="#ccc" stroke="#111" stroke-width="3"/><path d="M12 38l-2 9 9-9" fill="#ccc" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M15 32V22l5-7c2 0 3 1 3 3l-1 4h7c2 0 3 2 2 4l-2 6c0 1-1 2-2 2H15z" fill="#f4c19b" stroke="#111" stroke-width="2"/><path d="M44 6l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f5c400"/></svg>
      <div><strong>3. 격려 중심 관람</strong><span>결과보다는 과정과 도전을 칭찬해 주세요.</span></div></li>
  </ul>
</section>
<section class="box sign" aria-labelledby="w">
  <h2 class="pill" id="w">작성해주세요</h2>
  <div>등록부 서명</div>
  <div>참관록 가져가셔서 작성 부탁드립니다.</div>
</section>
</template>

<script>
const P={1:"09:10~09:50",2:"10:00~10:40",3:"10:50~11:30",4:"11:40~12:20"};
const C=[
 {id:"g1",l:"1학년 교실",c:"1학년",s:"통합(약속)",p:1,t:"지구를 위한 소비",d:"지구를 지키기 위해 가정과 학교에서 할 수 있는 일 찾아보고 부모님과 함께 약속 정하기"},
 {id:"g2",l:"2학년 교실",c:"2학년",s:"통합(인물)",p:3,t:"세종대왕 챗봇을 활용하여 세종대왕 탐구하기",d:""},
 {id:"g3",l:"3학년 교실",c:"3학년",s:"국어",p:2,t:"4. 서로 존중하며 대화해요",d:"높임 표현을 바르게 사용하는 방법 알기"},
 {id:"g4",l:"4학년 교실",c:"4학년",s:"국어",p:2,t:"매체 단원",d:"자료를 활용하여 발표하기"},
 {id:"g5",l:"5학년 교실",c:"5학년",s:"사회",p:1,t:"1. 유적과 유물로 살펴본 옛 사람들의 생활",d:"선사~고려 시대별 구분하여 조별 발표 및 퀴즈 풀기"},
 {id:"g6",l:"6학년 교실",c:"6학년",s:"사회, 수학 융합",p:3,t:"아르헨티나 라 보카 탐구 융합수업",d:"아르헨티나 라 보카 지역의 지리·문화·건축적 특징을 탐구하여 발표하고, 보드게임 ‘라 보카’를 활용해 여러 방향에서 본 입체도형을 추론·구성하는 융합수업"},
 {id:"health",l:"6학년 교실",c:"보건(6학년)",s:"보건",p:4,t:"존중하고 배려하는 성",d:"올바른 성 가치관 확립, 4가지 주제로 발표하기"},
 {id:"raon",l:"라온반 교실",c:"라온반",s:"수학",p:4,t:"6. 그림그래프",d:"표를 그림그래프로 나타내기"},
 {id:"ethics",l:"과학실",c:"전담(5학년)",s:"도덕",p:4,t:"6. 공동체를 정의롭게",d:"공동체에서 규칙의 필요성 알기"}
];
const COL={"1학년":["#e8453c","#ffe3e0"],"2학년":["#f08a1c","#ffecd6"],"3학년":["#f2c200","#fff6cc"],"4학년":["#2fa84f","#def5e3"],"5학년":["#1e88e5","#dcecfb"],"6학년":["#5b4bd6","#e7e4fb"],"보건(6학년)":["#e0457b","#fde1ec"],"라온반":["#129b9b","#d8f2f2"],"전담(5학년)":["#8e44ad","#f1e1f7"]};
const sty=x=>`--col:${COL[x.c][0]};--tint:${COL[x.c][1]};${x.c==="3학년"?"--ink:#232323;":""}`;
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const app=document.getElementById("app");
const TITLE='<div class="bar">2026 모산초등학교 학부모 공개수업 · 10월 20일(화)</div>';
const HOME_BTN='<a class="btn wide" href="#home">⌂ 처음으로 돌아가기</a>';

function home(){
  return `<header class="hero"><h1>2026 모산초등학교<br>학부모 공개수업</h1>
  <p>행복하고 안전한 수업을 위해 함께해 주셔서 감사합니다.</p><span class="when">10월 20일 화요일</span></header>
  <section class="box glancebox" aria-labelledby="g"><h2 class="pill" id="g">한눈에 보기</h2><div class="glance">
  ${[1,2,3,4].map(p=>`<div class="period"><div class="pnum"><b>${p}교시</b><small>${P[p]}</small></div><div class="rows">
   ${C.filter(x=>x.p===p).map(x=>`<a class="row" style="${sty(x)}" href="#${x.id}"><span class="c">${esc(x.c)}</span><span class="s">${esc(x.s)}</span><span class="go" aria-hidden="true">›</span><span class="t">${esc(x.t)}</span><span class="l">📍 ${esc(x.l)}</span></a>`).join("")}
  </div></div>`).join("")}</div><p class="hint">반을 누르면 그 반 수업 안내가 열려요.</p></section>
  <div class="btns"><a class="btn wide light" href="#asks">관람 안내 · 작성해 주세요 ›</a></div>`;
}
function cls(x){
  const i=C.indexOf(x),prev=C[(i+C.length-1)%C.length],next=C[(i+1)%C.length];
  return `${TITLE}<div class="btns">${HOME_BTN}</div>
  <article class="card" style="${sty(x)}"><h2 class="cls">${esc(x.c)}</h2><dl class="kv">
   <div><dt>과목</dt><dd>${esc(x.s)}</dd></div>
   <div><dt>장소</dt><dd>${esc(x.l)}</dd></div>
   <div><dt>일시</dt><dd>10월 20일 화요일 ${x.p}교시 (${P[x.p]})</dd></div>
   <div><dt>수업주제</dt><dd><b>${esc(x.t)}</b>${x.d?esc(x.d):""}</dd></div></dl></article>
  <div class="btns"><a class="btn light" href="#${prev.id}">‹ ${esc(prev.c)}</a><a class="btn light" href="#${next.id}">${esc(next.c)} ›</a></div>
  <nav class="others" aria-label="다른 반">${C.map(o=>`<a style="${sty(o)}" href="#${o.id}" aria-current="${o===x}">${esc(o.c)}</a>`).join("")}</nav>
  <div class="btns"><a class="btn wide light" href="#asks">관람 안내 · 작성해 주세요 ›</a>${HOME_BTN}</div>`;
}
function asks(){
  return `${TITLE}<div class="btns">${HOME_BTN}</div>${document.getElementById("t-asks").innerHTML}<div class="btns">${HOME_BTN}</div>`;
}
function route(){
  const h=location.hash.slice(1),x=C.find(c=>c.id===h);
  app.innerHTML=x?cls(x):h==="asks"?asks():home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
