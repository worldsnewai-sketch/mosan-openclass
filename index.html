<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 모산초등학교 학부모 공개수업</title>
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 학교 안내문 그대로 — 보라 테두리 · 분홍 제목상자 · 남색 제목띠 / 화면 3개로 나눔: 처음(한눈에 보기) · 반별 수업 안내 · 관람 안내 */
:root{
  --frame:#dcebf7; --panel:#ffffff; --head:#ffbac8; --box:#ffe0e6; --border:#2e2e2e;
  --navy:#1b3a5c; --mint:#c9f3d3; --fg:#232323; --muted:#555;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light only;
}
body{background:var(--frame);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:820px;margin:0 auto;padding-block:16px 32px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:5px solid var(--border);padding:16px 14px 22px;display:grid;gap:18px}
@media (max-width:480px){.page{padding-block:10px 20px}.sheet{padding:12px 10px 18px;border-width:4px}.box{padding:14px 10px}}
h1,h2,.pill,.cls{font-family:var(--display);font-weight:400}
.hero{background:var(--head);border:5px solid var(--border);padding:16px 14px;text-align:center}
.hero h1{margin:0;font-size:clamp(26px,7vw,44px);line-height:1.2;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--navy);font-family:var(--display);font-size:clamp(18px,4.8vw,24px);text-wrap:balance}
.hero .when{display:inline-block;margin-top:10px;background:var(--navy);color:var(--mint);border-radius:999px;padding:4px 16px;font-family:var(--display);font-size:20px}
.bar{background:var(--head);border:4px solid var(--border);padding:8px 12px;text-align:center;font-family:var(--display);font-size:20px}
.pill{display:block;width:fit-content;margin:0 auto 12px;background:var(--navy);color:var(--mint);border-radius:999px;padding:4px 28px;font-size:26px}
.box{background:var(--box);border:4px solid var(--border);padding:16px 14px}
.glancebox{background:#fff}

/* 버튼 */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:8px 12px;border:3px solid var(--border);border-radius:12px;background:var(--navy);color:#fff;font-family:var(--display);font-size:21px;text-decoration:none;text-align:center;cursor:pointer}
.btn.light{background:#fff;color:var(--fg)}
.btn:focus-visible{outline:3px solid var(--head);outline-offset:2px}
.btn.wide{grid-column:1/-1}

/* 한눈에 표 */
.glance{display:grid;gap:10px}
.period{display:grid;gap:8px}
.pnum{background:var(--navy);color:#fff;border-radius:10px;display:flex;align-items:baseline;justify-content:center;gap:10px;padding:6px 12px}
.pnum b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.pnum small{color:var(--mint);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700}
.rows{display:grid;gap:6px;min-width:0}
.row{background:var(--tint,#fff);border:2px solid var(--border);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;text-decoration:none;color:inherit}
.row:hover,.row:focus-visible{outline:none;box-shadow:0 0 0 3px var(--col)}
.row .c{font-family:var(--display);font-size:22px;white-space:nowrap;background:var(--col);color:var(--ink,#fff);border-radius:6px;padding:0 9px}
.row .s{font-weight:700;color:var(--navy);font-size:17px;white-space:nowrap}
.row .go{font-family:var(--display);color:var(--navy);font-size:26px;line-height:1}
.row .t{grid-column:1/-1;font-size:19px;font-weight:700;line-height:1.4;margin-top:4px}
.row .l{grid-column:1/-1;font-size:16px;color:#333}
.hint{margin:12px 0 0;text-align:center;color:#333;font-size:16px}

/* 반별 상세 */
.card{background:var(--tint,#fff);border:4px solid var(--border);overflow:hidden}
.card .cls{font-size:32px;margin:0;background:var(--col);color:var(--ink,#fff);padding:8px 16px;border-bottom:4px solid var(--border)}
.kv{margin:0;padding:14px 16px 18px;display:grid;gap:12px}
.kv div{display:grid;gap:2px}
.kv dt{font-weight:700;color:var(--navy);font-size:16px}
.kv dd{margin:0;font-size:20px;font-variant-numeric:tabular-nums}
.kv dd b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.3;display:block}
.others{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.others a{font-family:var(--display);font-size:17px;text-decoration:none;background:var(--col);color:var(--ink,#fff);border:2px solid var(--border);border-radius:999px;padding:2px 12px}
.others a[aria-current="true"]{outline:3px solid var(--border);outline-offset:2px}

/* 안내도 */
.mapbox{background:#fff}
.map{display:block;width:100%;max-width:100%;height:auto}
.map text{font-family:var(--display)}
.mapnote{margin:12px 0 0;text-align:center;font-size:22px;font-family:var(--display)}
.floor{display:inline-block;color:#fff;border-radius:8px;padding:0 10px;margin-right:4px}.f2{background:#1e6fc2}.f1{background:#d9822b}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.legend a{font-family:var(--display);font-size:17px;text-decoration:none;background:var(--col);color:var(--ink,#fff);border:2px solid var(--border);border-radius:999px;padding:2px 12px}
@media (prefers-reduced-motion:no-preference){.pin{animation:bob 1.2s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* 부탁 */
.asks{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.asks li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.asks svg{width:52px;height:52px}
.asks strong{font-family:var(--display);font-weight:400;font-size:22px;display:block;line-height:1.25}
.asks span{color:#333;font-size:17px}
.sign{display:grid;gap:4px;text-align:center;font-family:var(--display);font-size:24px}
</style>
</head>
<body>

<div class="page"><div class="sheet" id="app"></div></div>

<template id="t-asks">
<section class="box" aria-labelledby="a">

      <div><strong>2. 사진, 동영상 촬영은 금지해주세요.</strong><span>마음에만, 눈에만 예쁘게 담아주시기를 부탁드립니다.</span></div></li>
    <li><svg viewBox="0 0 52 52" aria-hidden="true"><rect x="5" y="12" width="34" height="26" rx="3" fill="#ccc" stroke="#111" stroke-width="3"/><path d="M12 38l-2 9 9-9" fill="#ccc" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M15 32V22l5-7c2 0 3 1 3 3l-1 4h7c2 0 3 2 2 4l-2 6c0 1-1 2-2 2H15z" fill="#f4c19b" stroke="#111" stroke-width="2"/><path d="M44 6l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f5c400"/></svg>
      <div><strong>3. 격려 중심 관람</strong><span>결과보다는 과정과 도전을 칭찬해 주세요.</span></div></li>

</section>
</template>

<script>
const P={1:"09:10~09:50",2:"10:00~10:40",3:"10:50~11:30",4:"11:40~12:20"};
const C=[
 {id:"g1",l:"1학년 교실",c:"1학년",s:"통합(약속)",p:1,t:"지구를 위한 소비",d:"지구를 지키기 위해 가정과 학교에서 할 수 있는 일 찾아보고 부모님과 함께 약속 정하기"},
 {id:"g2",l:"2학년 교실",c:"2학년",s:"통합(인물)",p:3,t:"세종대왕 챗봇을 활용하여 세종대왕 탐구하기",d:""},
 {id:"g3",l:"3학년 교실",c:"3학년",s:"국어",p:2,t:"4. 서로 존중하며 대화해요",d:"높임 표현을 바르게 사용하는 방법 알기"},
 {id:"g4",l:"4학년 교실",c:"4학년",s:"국어",p:2,t:"매체 단원",d:"자료를 활용하여 발표하기"},
 {id:"g5",l:"5학년 교실",c:"5학년",s:"사회",p:1,t:"1. 유적과 유물로 살펴본 옛 사람들의 생활",d:"선사~고려 시대별 구분하여 조별 발표 및 퀴즈 풀기"},
 {id:"g6",l:"6학년 교실",c:"6학년",s:"사회, 수학 융합",p:3,t:"아르헨티나 라 보카 탐구 융합수업",d:"아르헨티나 라 보카 지역의 지리·문화·건축적 특징을 탐구하여 발표하고, 보드게임 ‘라 보카’를 활용해 여러 방향에서 본 입체도형을 추론·구성하는 융합수업"},
 {id:"health",l:"6학년 교실",c:"보건(6학년)",s:"보건",p:4,t:"존중하고 배려하는 성",d:"올바른 성 가치관 확립, 4가지 주제로 발표하기"},
 {id:"raon",l:"라온반 교실",c:"라온반",s:"수학",p:4,t:"6. 그림그래프",d:"표를 그림그래프로 나타내기"},
 {id:"ethics",l:"과학실",c:"전담(5학년)",s:"도덕",p:4,t:"6. 공동체를 정의롭게",d:"공동체에서 규칙의 필요성 알기"}
];
const ROOM={g1:"r1",g2:"r2",g3:"r3",g4:"r4",g5:"r5",g6:"r6",health:"r6",raon:"raon",ethics:"sci"};
const FLOOR={r1:"2층",r2:"2층",r3:"2층",r4:"2층",r5:"2층",r6:"2층",sci:"2층",raon:""};
const ROOMS=[
 // 위쪽 건물
 {x:10,y:12,w:40,h:44,t:"담소"},{x:50,y:12,w:18,h:44,t:"창고"},{x:80,y:12,w:50,h:44,t:"시설\n관리실"},{x:140,y:12,w:56,h:30,t:"분리수거실"},
 {x:208,y:12,w:20,h:44,t:"통통실"},{x:228,y:12,w:20,h:44,t:"준비실"},{id:"raon",x:252,y:12,w:64,h:50,t:"라온반"},{x:316,y:12,w:66,h:50,t:"돌봄\n교실"},
 // 2층 교실 줄
 {id:"sci",x:28,y:80,w:50,h:54,t:"과학실"},{id:"r6",x:78,y:80,w:48,h:54,t:"6학년"},{id:"r5",x:126,y:80,w:48,h:54,t:"5학년"},{x:174,y:80,w:22,h:54,t:"교장실"},
 {id:"r4",x:196,y:80,w:44,h:54,t:"4학년"},{id:"r3",x:240,y:80,w:44,h:54,t:"3학년"},{id:"r2",x:284,y:80,w:44,h:54,t:"2학년"},{id:"r1",x:328,y:80,w:44,h:54,t:"1학년"},
 // 가운데
 {x:226,y:146,w:46,h:34,t:"사랑\n소반"},{x:272,y:146,w:50,h:34,t:"조리실"},
 // 1층
 {x:38,y:196,w:112,h:50,t:"모산책방"},{x:150,y:196,w:14,h:50,t:"서고"},{x:164,y:196,w:26,h:50,t:"행정실"},
 {x:214,y:196,w:46,h:50,t:"교무실"},{x:260,y:196,w:18,h:50,t:"보건실"},{x:278,y:196,w:18,h:50,t:"정보실"},{x:296,y:196,w:18,h:50,t:"쉼터"},{x:314,y:196,w:18,h:50,t:"유치원실"},{x:332,y:196,w:32,h:50,t:"병설\n유치원"}
];
function label(r,fill,big){
  const cx=r.x+r.w/2,cy=r.y+r.h/2;
  if(r.w<30){const ch=[...r.t.replace("\n","")];const fs=r.w<20?9:10,lh=fs+1;const y0=cy-(ch.length-1)*lh/2;
    return `<text x="${cx}" y="${y0}" font-size="${fs}" fill="${fill}" text-anchor="middle" dominant-baseline="middle">${ch.map((c,i)=>`<tspan x="${cx}" y="${y0+i*lh}">${c}</tspan>`).join("")}</text>`;}
  const ls=r.t.split("\n"),fs=big?16:(ls.length>1?11:12),lh=fs+2,y0=cy-(ls.length-1)*lh/2;
  return `<text x="${cx}" y="${y0}" font-size="${fs}" fill="${fill}" text-anchor="middle" dominant-baseline="middle">${ls.map((l,i)=>`<tspan x="${cx}" y="${y0+i*lh}">${l}</tspan>`).join("")}</text>`;
}
const FLOORS=`<rect x="2" y="70" width="38" height="72" rx="8" fill="#1e6fc2"/><text x="21" y="106" font-size="19" fill="#fff" text-anchor="middle" dominant-baseline="middle">2층</text>
  <rect x="2" y="186" width="38" height="70" rx="8" fill="#d9822b"/><text x="21" y="221" font-size="19" fill="#fff" text-anchor="middle" dominant-baseline="middle">1층</text>`;
function mapSVG(focus){ // focus: class object or null (전체)
  const colorOf={};
  if(focus){colorOf[ROOM[focus.id]]=focus;} else {C.forEach(x=>{if(!colorOf[ROOM[x.id]])colorOf[ROOM[x.id]]=x;});}
  let g=`<rect x="0" y="0" width="400" height="300" rx="10" fill="#eef5e6"/>
  <rect x="6" y="70" width="388" height="72" fill="#bcd3ea"/><rect x="6" y="186" width="388" height="70" fill="#f3d9a6"/>
  <rect x="190" y="186" width="24" height="70" fill="#f8e7c4"/>
  <rect x="10" y="80" width="18" height="54" fill="#fff" stroke="#8a7b6c"/><rect x="372" y="80" width="18" height="54" fill="#fff" stroke="#8a7b6c"/>
  ${[0,1,2,3,4,5].map(i=>`<line x1="10" x2="28" y1="${86+i*8}" y2="${86+i*8}" stroke="#8a7b6c"/><line x1="372" x2="390" y1="${86+i*8}" y2="${86+i*8}" stroke="#8a7b6c"/>`).join("")}
  <text x="19" y="146" font-size="9" fill="#5a4c3f" text-anchor="middle">계단</text><text x="381" y="146" font-size="9" fill="#5a4c3f" text-anchor="middle">계단</text>
  <rect x="10" y="204" width="28" height="42" fill="#fff" stroke="#8a7b6c"/>${label({x:10,y:204,w:28,h:42,t:"현관"},"#2e2e2e")}
  <rect x="364" y="204" width="26" height="42" fill="#fff" stroke="#8a7b6c"/>${label({x:364,y:204,w:26,h:42,t:"현관"},"#2e2e2e")}
  <rect x="40" y="266" width="320" height="26" rx="13" fill="#d8bf98"/><text x="200" y="279" font-size="12" fill="#5a4c3f" text-anchor="middle" dominant-baseline="middle">운동장 · 조례대</text>`;
  let pin="";
  ROOMS.forEach(r=>{
    const x=r.id&&colorOf[r.id];
    if(x){const [c]=COL[x.c];const ink=x.c==="3학년"?"#232323":"#fff";
      g+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${c}" stroke="#2e2e2e" stroke-width="${focus?3:1.5}"/>${label(r,ink,!!focus)}`;
      if(focus){const cx=r.x+r.w/2;pin=`<g class="pin"><path d="M${cx} ${r.y-2}c-9-12-14-17-14-24a14 14 0 0 1 28 0c0 7-5 12-14 24z" fill="#e0261c" stroke="#fff" stroke-width="2"/><circle cx="${cx}" cy="${r.y-26}" r="5" fill="#fff"/></g>`;}
    } else {
      const cls=r.id;g+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${cls?"#ffffff":"#e8e3dc"}" stroke="#8a7b6c"/>${label(r,cls?"#2e2e2e":"#6b6158")}`;
    }
  });
  if(focus){ // 핀이 위로 넘칠 수 있게 여유
    return `<svg class="map" viewBox="0 -30 444 330" role="img" aria-label="학교 안내도: ${esc(focus.l)} 위치">${FLOORS}<g transform="translate(44 0)">${g}${pin}</g></svg>`;}
  return `<svg class="map" viewBox="0 0 444 300" role="img" aria-label="학교 안내도: 공개수업 교실 위치">${FLOORS}<g transform="translate(44 0)">${g}</g></svg>`;
}
const COL={"1학년":["#e8453c","#ffe3e0"],"2학년":["#f08a1c","#ffecd6"],"3학년":["#f2c200","#fff6cc"],"4학년":["#2fa84f","#def5e3"],"5학년":["#1e88e5","#dcecfb"],"6학년":["#5b4bd6","#e7e4fb"],"보건(6학년)":["#e0457b","#fde1ec"],"라온반":["#129b9b","#d8f2f2"],"전담(5학년)":["#8e44ad","#f1e1f7"]};
const sty=x=>`--col:${COL[x.c][0]};--tint:${COL[x.c][1]};${x.c==="3학년"?"--ink:#232323;":""}`;
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const app=document.getElementById("app");
const TITLE='<div class="bar">2026 모산초등학교 학부모 공개수업 · 10월 20일(화)</div>';
const HOME_BTN='<a class="btn wide" href="#home">⌂ 처음으로 돌아가기</a>';

function home(){
  return `<header class="hero"><h1>2026 모산초등학교<br>학부모 공개수업</h1>
  <p>행복하고 안전한 수업을 위해 함께해 주셔서 감사합니다.</p><span class="when">10월 20일 화요일</span></header>
  <section class="box glancebox" aria-labelledby="g"><h2 class="pill" id="g">한눈에 보기</h2><div class="glance">
  ${[1,2,3,4].map(p=>`<div class="period"><div class="pnum"><b>${p}교시</b><small>${P[p]}</small></div><div class="rows">
   ${C.filter(x=>x.p===p).map(x=>`<a class="row" style="${sty(x)}" href="#${x.id}"><span class="c">${esc(x.c)}</span><span class="s">${esc(x.s)}</span><span class="go" aria-hidden="true">›</span><span class="t">${esc(x.t)}</span><span class="l">📍 ${esc(x.l)}</span></a>`).join("")}
  </div></div>`).join("")}</div><p class="hint">반을 누르면 그 반 수업 안내가 열려요.</p></section>
  <div class="btns"><a class="btn wide" href="#map">🗺 학교 안내도 · 교실 위치</a><a class="btn wide light" href="#asks">관람 안내 · 작성해 주세요 ›</a></div>`;
}
function mapPage(){
  return `${TITLE}<div class="btns">${HOME_BTN}</div>
  <section class="box mapbox" aria-labelledby="m"><h2 class="pill" id="m">학교 안내도</h2>${mapSVG(null)}
  <p class="mapnote">색칠된 곳이 공개수업 교실이에요. 반을 누르면 안내가 열려요.</p>
  <nav class="legend" aria-label="반별 위치">${C.map(o=>`<a style="${sty(o)}" href="#${o.id}">${esc(o.c)} · ${FLOOR[ROOM[o.id]]?FLOOR[ROOM[o.id]]+" ":""}${esc(o.l)}</a>`).join("")}</nav></section>
  <div class="btns">${HOME_BTN}</div>`;
}
function cls(x){
  const i=C.indexOf(x),prev=C[(i+C.length-1)%C.length],next=C[(i+1)%C.length];
  return `${TITLE}<div class="btns">${HOME_BTN}</div>
  <article class="card" style="${sty(x)}"><h2 class="cls">${esc(x.c)}</h2><dl class="kv">
   <div><dt>과목</dt><dd>${esc(x.s)}</dd></div>
   <div><dt>장소</dt><dd>${esc(x.l)}</dd></div>
   <div><dt>일시</dt><dd>10월 20일 화요일 ${x.p}교시 (${P[x.p]})</dd></div>
   <div><dt>수업주제</dt><dd><b>${esc(x.t)}</b>${x.d?esc(x.d):""}</dd></div></dl></article>
  <section class="box mapbox" aria-labelledby="m"><h2 class="pill" id="m">교실 위치</h2>${mapSVG(x)}
   <p class="mapnote">${FLOOR[ROOM[x.id]]?`<span class="floor f${FLOOR[ROOM[x.id]][0]}">${FLOOR[ROOM[x.id]]}</span> `:"📍 "}${esc(x.l)}</p></section>
  <div class="btns"><a class="btn light" href="#${prev.id}">‹ ${esc(prev.c)}</a><a class="btn light" href="#${next.id}">${esc(next.c)} ›</a></div>
  <nav class="others" aria-label="다른 반">${C.map(o=>`<a style="${sty(o)}" href="#${o.id}" aria-current="${o===x}">${esc(o.c)}</a>`).join("")}</nav>
  <div class="btns"><a class="btn wide light" href="#asks">관람 안내 · 작성해 주세요 ›</a>${HOME_BTN}</div>`;
}
function asks(){
  return `${TITLE}<div class="btns">${HOME_BTN}</div>${document.getElementById("t-asks").innerHTML}<div class="btns">${HOME_BTN}</div>`;
}
function route(){
  const h=location.hash.slice(1),x=C.find(c=>c.id===h);
  app.innerHTML=x?cls(x):h==="asks"?asks():h==="map"?mapPage():home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
